<svg viewBox="0 0 1200 545" xmlns="http://www.w3.org/2000/svg" class="an" role="img" aria-label="oh-my-im 整体架构">
<style>
.an{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.bx{fill:#ffffff;stroke:#93c5fd;stroke-width:1.6}
.co{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8}
.ag{fill:#f0f9ff;stroke:#0284c7;stroke-width:1.8}
.st{fill:#ecfdf5;stroke:#16a34a;stroke-width:1.8}
.tt{font-size:14px;font-weight:700;fill:#1e40af;text-anchor:middle}
