及背书转让的主要法律后果。',ans:'背书连续是指票据上前后手背书在形式上衔接，持票人可据此证明票据权利。背书转让后，被背书人取得票据权利，背书人通常对后手承担票据责任，但禁止背书等特殊情形除外。'},{kind:'subject',title:'第3题（6分）增值税',q:'某一般纳税人不含税销售额100,000元，税率13%，进项税额6,000元。计算应纳增值税并说明计算依据。',ans:'销项税额=100,000×13%=13,000元；应纳增值税=13,000-6,000=7,000元。应列明销项税额、可抵扣进项税额及差额。'}]),C('五、综合题',12,[{kind:'subject',title:'第1题（12分）公司治理综合案例',q:'甲公司董事长未经股东会批准，以公司名义为关联企业提供担保；同时将公司资金借给本人控制的企业。请分析相关行为的程序要求、可能的法律责任及股东救济。',ans:'关联担保通常需依法律及章程履行股东会决议等程序，关联董事应回避表决；董事、高级管理人员不得利用关联关系损害公司利益。造成损失的，应承担赔偿责任。股东可依法请求公司追究责任，在符合条件时提起股东代表诉讼，并可对损害公司利益的决议或行为寻求司法救济。'}])];

function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const root=document.getElementById('exams');root.innerHTML='';Object.entries(subjects).forEach(([key,sub])=>{const el=document.createElement('article');el.className='exam '+(key==='practice'?'active':'');el.id=key;el.innerHTML=`<div class="exam-head"><div><h2>${sub.name}</h2><p>考试时长 ${sub.time} · 满分100分 · 合格线60分</p></div><div class="score"><b id="score-${key}">0</b><span>/ 100 分</span></div></div><div class="tools"><button class="action" data-score="${key}">提交并计分</button><button class="action alt" data-reveal="${key}">显示本科答案</button><button class="action alt" data-reset="${key}">重置本科</button></div>`;sub.sections.forEach((sec,si)=>{const box=document.createElement('section');box.className='section';box.innerHTML=`<div class="section-title"><b>${sec.title}</b><span>${sec.qs.length}题 · ${sec.score}分</span></div>`;sec.qs.forEach((item,qi)=>{const q=document.createElement('div');q.className='q '+(Array.isArray(item.a)?'multi':'');const id=`${key}-${si}-${qi}`;if(item.kind==='subject'){q.innerHTML=`<div class="qtop"><span>${item.title}</span><span>${sec.score/sec.qs.length}分</span></div><div class="qtext">${item.q}</div><textarea class="subjective" placeholder="在这里写你的答题要点（主观题请对照答案自评）" data-subject="${id}"></textarea><div class="answer" data-answer="${id}"><b>参考答案与采分点：</b>${item.ans}</div>`}else if(typeof item.a==='boolean'){q.innerHTML=`<div class="qtop"><span>${qi+1}. 判断题</span><span>1分</span></div><div class="qtext">${item.q}</div><div class="options"><button class="option" data-value="true" data-id="${id}" data-answer="${item.a}">正确</button><button class="option" data-value="false" data-id="${id}" data-answer="${item.a}">错误</button></div><div class="answer" data-answer="${id}"><b>答案：${item.a?'正确':'错误'}</b>　${item.e}</div>`}else{q.innerHTML=`<div class="qtop"><span>${qi+1}. ${Array.isArray(item.a)?'多项选择题':'单项选择题'}</span><span>${Array.isArray(item.a)?2:sec.score/sec.qs.length}分</span></div><div class="qtext">${item.q}</div><div class="options">${item.o.map((op,oi)=>`<button class="option" data-value="${oi}" data-id="${id}" data-answer="${Array.isArray(item.a)?item.a.join(','):item.a}">${String.fromCharCode(65+oi)}. ${op}</button>`).join('')}</div><div class="answer" data-answer="${id}"><b>答案：${Array.isArray(item.a)?item.a.map(x=>String.fromCharCode(65+x)).join('、'):String.fromCharCode(65+item.a)}</b>　${item.e}</div>`}box.appendChild(q)});el.appendChild(box)});root.appendChild(el)})}

function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('zhongji-theme',theme);document.querySelectorAll('[data-theme-choice]').forEach(x=>x.classList.toggle('active',x.dataset.themeChoice===theme))}
applyTheme(localStorage.getItem('zhongji-theme')||'dark');
document.addEventListener('click',e=>{const theme=e.target.closest('[data-theme-choice]');if(theme){applyTheme(theme.dataset.themeChoice);toast(`已切换为${theme.textContent}主题`);return}const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('.exam').forEach(x=>x.classList.toggle('active',x.id===tab.dataset.tab));return}const op=e.target.closest('.option');if(op){const id=op.dataset.id;const group=[...document.querySelectorAll(`.option[data-id="${id}"]`)];const multi=op.closest('.q').classList.contains('multi');if(multi)op.classList.toggle('selected');else{group.forEach(x=>x.classList.remove('selected'));op.classList.add('selected')}return}const score=e.target.closest('[data-score]');if(score){scoreExam(score.dataset.score);return}const reveal=e.target.closest('[data-reveal]');if(reveal){document.querySelectorAll(`#${reveal.dataset.reveal} .answer`).forEach(x=>x.classList.add('show'));toast('答案已展开');return}const reset=e.target.closest('[data-reset]');if(reset){const el=document.getElementById(reset.dataset.reset);el.querySelectorAll('.option').forEach(x=>x.classList.remove('selected','correct','wrong'));el.querySelectorAll('.answer').forEach(x=>x.classList.remove('show'));el.querySelectorAll('textarea').forEach(x=>x.value='');el.querySelector('.score b').textContent='0';toast('本科已重置')}});
function scoreExam(key){let score=0,answered=0;const sub=subjects[key];sub.sections.forEach((sec,si)=>sec.qs.forEach((item,qi)=>{if(item.kind==='subject')return;const id=`${key}-${si}-${qi}`,ops=[...document.querySelectorAll(`.option[data-id="${id}"]`)],selected=ops.filter(x=>x.classList.contains('selected')).map(x=>Number(x.dataset.value));if(selected.length)answered++;const ans=Array.isArray(item.a)?item.a:[item.a];const ok=selected.length===ans.length&&selected.every(x=>ans.includes(x));ops.forEach(x=>{const v=Number(x.dataset.value);x.classList.toggle('correct',ans.includes(v));x.classList.toggle('wrong',x.classList.contains('selected')&&!ans.includes(v))});if(ok)score+=sec.score/sec.qs.length}));document.querySelector(`#score-${key}`).textContent=Number(score.toFixed(1));document.querySelectorAll(`#${key} .answer`).forEach(x=>x.classList.add('show'));toast(`已完成 ${answered} 道客观题，得分 ${Number(score.toFixed(1))}/100`)}
render();
</script>
</body></html>
